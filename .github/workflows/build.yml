name: 🍏 Build & Test macOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build macOS App Bundle & DMG
    runs-on: macos-14
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🧪 Validate Python Scripts
        run: |
          python3 -m py_compile tickr_app.py cli.py

      - name: 🛠️ Package Tickr.app, DMG & ZIP
        run: |
          chmod +x package.sh
          ./package.sh

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tickr-macOS-Build
          path: |
            dist/*.dmg
            dist/*.zip

