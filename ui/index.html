<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tickr</title>
  <style>
    :root {
      --bg: #0C0D11;
      --bg-surface: #14151B;
      --bg-surface-hover: #1B1C24;
      --bg-subtle: rgba(255, 255, 255, 0.04);
      --border-primary: rgba(255, 255, 255, 0.1);
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.2);
      --fg-primary: #EDEDED;
      --fg-secondary: #9496A1;
      --fg-dim: #60626D;
      --emerald-dot: #10B981;
      --accent-pomodoro: #F59E0B;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font-sans);
    }

    body {
      background: var(--bg);
      color: var(--fg-primary);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-primary);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Top Navigation / Brand Header */
    .header {
      padding: 12px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border-primary);
      background: #000;
      padding: 1px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg-primary);
    }

    .brand-mono {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-dim);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Pomodoro Mini Bar */
    .pomo-widget {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pomo-widget.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--accent-pomodoro);
    }

    .pomo-btn {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 10px;
    }

    .status-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--emerald-dot);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--emerald-dot);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--fg-secondary);
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      border-color: var(--border-hover);
      color: var(--fg-primary);
      background: var(--bg-surface-hover);
    }

    /* Category & Filter Tabs */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .seg-group {
      display: flex;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px;
    }

    .seg-item {
      background: transparent;
      border: none;
      color: var(--fg-secondary);
      font-size: 10.5px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-item.active {
      background: var(--bg-subtle);
      color: var(--fg-primary);
      border: 1px solid var(--border-primary);
    }

    .cat-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      align-items: center;
    }
    .cat-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 3px 6px;
      border-radius: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--fg-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .cat-pill:hover {
      border-color: var(--border-hover);
      color: var(--fg-primary);
    }

    .cat-pill.active {
      background: var(--fg-primary);
      color: var(--bg);
      font-weight: 600;
      border-color: var(--fg-primary);
    }

    /* Input Section */
    .input-box {
      padding: 9px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-select {
      font-family: var(--font-mono);
      font-size: 10px;
      background: var(--bg);
      border: 1px solid var(--border-primary);
      color: var(--fg-primary);
      padding: 4px 6px;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      max-width: 105px;
    }

    .task-field {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg-primary);
      font-size: 12px;
      outline: none;
    }

    .task-field::placeholder {
      color: var(--fg-dim);
    }

    .enter-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--fg-dim);
      border: 1px solid var(--border-subtle);
      padding: 2px 4px;
      border-radius: 3px;
      background: var(--bg);
    }

    /* Tasks Container */
    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .task-list::-webkit-scrollbar {
      width: 4px;
    }
    .task-list::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 4px;
    }

    /* Task Card */
    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .task-item:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-hover);
    }

    .check-box {
      width: 15px;
      height: 15px;
      border-radius: 3.5px;
      border: 1.5px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .task-item:hover .check-box {
      border-color: var(--fg-secondary);
    }

    .task-item.completed .check-box {
      background: var(--emerald-dot);
      border-color: var(--emerald-dot);
    }

    .check-box svg {
      display: none;
      width: 9px;
      height: 9px;
      stroke: #000;
      stroke-width: 2.5;
    }

    .task-item.completed .check-box svg {
      display: block;
    }

    .task-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .task-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg-primary);
      transition: all 0.15s ease;
      word-break: break-word;
    }

    .task-item.completed .task-name {
      color: var(--fg-dim);
      text-decoration: line-through;
    }

    .task-badge {
      font-family: var(--font-mono);
      font-size: 8.5px;
      color: var(--fg-dim);
      border: 1px solid var(--border-subtle);
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .del-btn {
      opacity: 0;
      background: transparent;
      border: none;
      color: var(--fg-dim);
      cursor: pointer;
      font-size: 12px;
      padding: 2px;
      transition: all 0.15s ease;
    }

    .task-item:hover .del-btn {
      opacity: 1;
    }

    .del-btn:hover {
      color: #EF4444;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
      text-align: center;
      gap: 6px;
    }

    .empty-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--fg-primary);
    }

    .empty-desc {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-dim);
    }

    /* Settings & Tag Manager Modal Overlay */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(12, 13, 17, 0.96);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      z-index: 50;
      padding: 16px;
      animation: fadeIn 0.15s ease;
    }

    .modal-overlay.open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--fg-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .settings-section {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--fg-primary);
    }

    .setting-desc {
      font-size: 10px;
      color: var(--fg-dim);
      margin-top: 2px;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border-primary);
      transition: .2s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--emerald-dot); }
    input:checked + .slider:before { transform: translateX(14px); }

    .tag-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      overflow-y: auto;
    }

    .tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
    }

    .tag-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--fg-primary);
    }

    .tag-del-btn {
      background: transparent;
      border: none;
      color: var(--fg-dim);
      cursor: pointer;
      font-size: 11px;
    }
    .tag-del-btn:hover { color: #EF4444; }

    .add-tag-box {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .tag-input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      color: var(--fg-primary);
      font-family: var(--font-mono);
      font-size: 10.5px;
      padding: 5px 7px;
      border-radius: 5px;
      outline: none;
      text-transform: uppercase;
    }

    .btn-add-tag {
      background: var(--fg-primary);
      color: var(--bg);
      border: none;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Footer Toolbar */
    .footer {
      padding: 9px 14px;
      background: var(--bg);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .footer-mono {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-dim);
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-publish {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #EDEDED;
      color: #0C0D11;
      border: none;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3.5px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-publish:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-publish.deploying {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .action-link {
      background: transparent;
      border: none;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--fg-dim);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .action-link:hover { color: var(--fg-primary); }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="header">
    <div class="brand-row">
      <div class="brand-left">
        <img src="assets/avatar.svg" alt="Mahmoud" class="brand-avatar">
        <span class="brand-title">Tickr</span>
        <span class="brand-mono">// ⌘⇧T</span>
      </div>
      <div class="header-actions">
        <!-- Pomodoro Focus Widget -->
        <div class="pomo-widget" id="pomo-widget" onclick="togglePomodoro()">
          <span>⏱️</span>
          <span id="pomo-time">25:00</span>
          <button class="pomo-btn" id="pomo-ctrl">▶</button>
        </div>

        <button class="btn-icon" title="Settings & Tags" onclick="openSettingsModal()">⚙️</button>
        
        <div class="status-live">
          <span class="status-dot"></span>
          <span id="active-counter">0 Active</span>
        </div>
      </div>
    </div>

    <!-- Filter & Category Row -->
    <div class="controls-row">
      <div class="seg-group">
        <button class="seg-item active" onclick="setFilter('all', this)">All</button>
        <button class="seg-item" onclick="setFilter('active', this)">Active</button>
        <button class="seg-item" onclick="setFilter('done', this)">Done</button>
      </div>

      <div class="cat-bar" id="cat-bar">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Input Section -->
  <div class="input-box">
    <select id="cat-input" class="cat-select">
      <!-- Rendered dynamically -->
    </select>
    <input type="text" id="task-field" class="task-field" placeholder="Add task to esawi.dev..." onkeydown="handleKey(event)" autofocus>
    <span class="enter-badge">↵</span>
  </div>

  <!-- Task List -->
  <div class="task-list" id="task-container">
    <!-- Rendered via JS -->
  </div>

  <!-- Bottom Footer -->
  <div class="footer">
    <div class="footer-mono" id="footer-summary">0 pending</div>
    <div class="footer-actions">
      <button class="btn-publish" id="publish-btn" onclick="publishToLive()">
        <span>🚀 Push to Live</span>
      </button>
      <button class="action-link" onclick="quitApp()">Quit</button>
    </div>
  </div>

  <!-- Settings & Custom Tags Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-header">
      <div class="modal-title">⚙️ Settings & Tags</div>
      <button class="btn-icon" onclick="closeSettingsModal()">✕</button>
    </div>

    <!-- Launch at Login Toggle -->
    <div class="settings-section">
      <div class="setting-row">
        <div>
          <div>Launch at Mac Startup</div>
          <div class="setting-desc">Auto-start Tickr quietly in menu bar on boot</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="autostart-toggle" onchange="toggleAutostart(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Tag Manager -->
    <div class="modal-title" style="margin-bottom: 8px; font-size: 11.5px;">🏷️ Custom Category Tags</div>
    <div class="tag-grid" id="tag-list-manager">
      <!-- Rendered dynamically -->
    </div>

    <div class="add-tag-box">
      <input type="text" id="new-tag-input" class="tag-input" placeholder="NEW TAG NAME..." onkeydown="handleTagKey(event)">
      <button class="btn-add-tag" onclick="addNewTag()">+ Add</button>
    </div>
  </div>

  <script>
    let tasks = [];
    let tags = ["PROJECT", "CODE", "HACKATHON", "DAILY", "IDEAS"];
    let currentFilter = 'all';
    let currentCategory = null;
    let autostart = false;

    /* Pomodoro Timer State */
    let pomoSeconds = 25 * 60;
    let pomoInterval = null;
    let pomoRunning = false;

    function initTasks(initialTasks, customTags, isAutostart) {
      tasks = initialTasks || [];
      if (customTags && Array.isArray(customTags) && customTags.length > 0) {
        tags = customTags;
      }
      if (typeof isAutostart === 'boolean') {
        autostart = isAutostart;
        const toggle = document.getElementById('autostart-toggle');
        if (toggle) toggle.checked = autostart;
      }
      renderTagPills();
      render();
    }

    function saveTasksToNative() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({
          action: "save",
          data: JSON.stringify(tasks),
          tags: JSON.stringify(tags)
        });
      }
    }

    function toggleAutostart(enabled) {
      autostart = enabled;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({
          action: "set_autostart",
          enabled: enabled
        });
      }
    }

    function publishToLive() {
      const btn = document.getElementById('publish-btn');
      btn.innerHTML = '<span>⏳ Pushing...</span>';
      btn.classList.add('deploying');
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({
          action: "publish",
          data: JSON.stringify(tasks),
          tags: JSON.stringify(tags)
        });
      }
    }

    window.onPublishSuccess = function() {
      const btn = document.getElementById('publish-btn');
      btn.innerHTML = '<span>✓ Live! 🚀</span>';
      btn.classList.remove('deploying');
      setTimeout(() => {
        btn.innerHTML = '<span>🚀 Push to Live</span>';
      }, 3000);
    };

    function quitApp() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({ action: "quit" });
      }
    }

    /* Pomodoro Timer Engine */
    function togglePomodoro() {
      if (pomoRunning) {
        pausePomodoro();
      } else {
        startPomodoro();
      }
    }

    function startPomodoro() {
      pomoRunning = true;
      document.getElementById('pomo-widget').classList.add('active');
      document.getElementById('pomo-ctrl').textContent = '⏸';
      clearInterval(pomoInterval);
      pomoInterval = setInterval(() => {
        if (pomoSeconds > 0) {
          pomoSeconds--;
          updatePomoDisplay();
        } else {
          finishPomodoro();
        }
      }, 1000);
    }

    function pausePomodoro() {
      pomoRunning = false;
      document.getElementById('pomo-ctrl').textContent = '▶';
      clearInterval(pomoInterval);
      updateTimerInMenuBar("");
    }

    function updatePomoDisplay() {
      const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');
      const s = String(pomoSeconds % 60).padStart(2, '0');
      const timeStr = `${m}:${s}`;
      document.getElementById('pomo-time').textContent = timeStr;
      updateTimerInMenuBar(timeStr);
    }

    function finishPomodoro() {
      pausePomodoro();
      pomoSeconds = 25 * 60;
      document.getElementById('pomo-time').textContent = '25:00';
      document.getElementById('pomo-widget').classList.remove('active');
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({
          action: "notify",
          title: "🎉 Focus Session Finished!",
          message: "25 minutes of deep work completed. Take a 5-minute break!"
        });
      }
    }

    function updateTimerInMenuBar(text) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tickr) {
        window.webkit.messageHandlers.tickr.postMessage({
          action: "timer_update",
          text: text
        });
      }
    }

    /* Settings & Tag Manager */
    function openSettingsModal() {
      document.getElementById('settings-modal').classList.add('open');
      renderTagManager();
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.remove('open');
      renderTagPills();
      render();
    }

    function renderTagManager() {
      const container = document.getElementById('tag-list-manager');
      container.innerHTML = tags.map((t, idx) => `
        <div class="tag-row">
          <span class="tag-label">[${t}]</span>
          ${tags.length > 1 ? `<button class="tag-del-btn" onclick="removeTag(${idx})">✕</button>` : ''}
        </div>
      `).join('');
    }

    function handleTagKey(e) {
      if (e.key === 'Enter') {
        addNewTag();
      }
    }

    function addNewTag() {
      const input = document.getElementById('new-tag-input');
      const val = input.value.trim().toUpperCase();
      if (val && !tags.includes(val)) {
        tags.push(val);
        input.value = '';
        renderTagManager();
        renderTagPills();
        saveTasksToNative();
      }
    }

    function removeTag(index) {
      if (tags.length > 1) {
        tags.splice(index, 1);
        renderTagManager();
        renderTagPills();
        saveTasksToNative();
      }
    }

    function renderTagPills() {
      const bar = document.getElementById('cat-bar');
      const select = document.getElementById('cat-input');

      bar.innerHTML = `
        <div class="cat-pill ${currentCategory === null ? 'active' : ''}" onclick="setCategory(null, this)">ALL</div>
        ${tags.map(t => `
          <div class="cat-pill ${currentCategory === t ? 'active' : ''}" onclick="setCategory('${t}', this)">${t}</div>
        `).join('')}
      `;

      select.innerHTML = tags.map(t => `
        <option value="${t}">${t}</option>
      `).join('');
    }

    function handleKey(e) {
      if (e.key === 'Enter') {
        const input = document.getElementById('task-field');
        const text = input.value.trim();
        if (!text) return;
        const category = document.getElementById('cat-input').value;
        tasks.unshift({
          id: Date.now(),
          title: text,
          category: category,
          done: false,
          created: new Date().toISOString()
        });
        input.value = '';
        saveTasksToNative();
        render();
      }
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        saveTasksToNative();
        render();
      }
    }

    function deleteTask(id, event) {
      event.stopPropagation();
      tasks = tasks.filter(t => t.id !== id);
      saveTasksToNative();
      render();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.seg-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function setCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function render() {
      const container = document.getElementById('task-container');
      const activeCount = tasks.filter(t => !t.done).length;
      const doneCount = tasks.filter(t => t.done).length;

      document.getElementById('active-counter').textContent = `${activeCount} Active`;
      document.getElementById('footer-summary').textContent = `${activeCount} pending // ${doneCount} done`;

      const filtered = tasks.filter(task => {
        if (currentFilter === 'active' && task.done) return false;
        if (currentFilter === 'done' && !task.done) return false;
        if (currentCategory && task.category.toUpperCase() !== currentCategory.toUpperCase()) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">All tasks completed</div>
            <div class="empty-desc">// zero active issues</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        return `
          <div class="task-item ${t.done ? 'completed' : ''}" onclick="toggleTask(${t.id})">
            <div class="check-box">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 13l4 4L19 7" stroke="#0C0D11" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="task-body">
              <div class="task-name">${t.title}</div>
              <span class="task-badge">${t.category || 'TASK'}</span>
            </div>
            <button class="del-btn" onclick="deleteTask(${t.id}, event)">✕</button>
          </div>
        `;
      }).join('');
    }

    renderTagPills();
  </script>
</body>
</html>
